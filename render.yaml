# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → pick this repository. You will be asked for the values marked
# `sync: false` (MongoDB Atlas connection string and the two seed passwords).
services:
  - type: web
    name: mfa-comparative-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas free (M0) connection string, e.g. mongodb+srv://user:pass@cluster0.xxxxx.mongodb.net/mfa_platform
      - key: MONGODB_URI
        sync: false
      # Random 256-bit secrets generated by Render (never stored in the repository).
      - key: JWT_SECRET
        generateValue: true
      - key: SECRETS_ENCRYPTION_KEY
        generateValue: true
      - key: OTP_HMAC_KEY
        generateValue: true
      # Passwords for the seeded accounts "admin" and "demo".
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_PASSWORD
        sync: false
      # One proxy hop (Render's load balancer) so rate limits see the real client IP.
      - key: TRUST_PROXY
        value: "1"
      # Ethereal test mailbox; the UI shows the preview link so visitors can read their code.
      # Demo setting: with a test mailbox, OOB Email is not a real second factor. For real
      # delivery set MAIL_PROVIDER=brevo (+ BREVO_SMTP_USER/BREVO_SMTP_KEY/MAIL_FROM) and remove the next line.
      - key: MAIL_PROVIDER
        value: ethereal
      - key: MAIL_TEST_INBOX_IN_UI
        value: "true"
      # The free instance has 512 MB RAM and one shared CPU: keep demo jobs small.
      - key: BENCHMARK_MAX_ITERATIONS
        value: "2000"
      - key: LOG_LEVEL
        value: info
      # WEBAUTHN_ORIGIN / WEBAUTHN_RP_ID / CLIENT_ORIGINS default to Render's RENDER_EXTERNAL_URL
      # and RENDER_EXTERNAL_HOSTNAME, so the service URL needs no manual configuration.
